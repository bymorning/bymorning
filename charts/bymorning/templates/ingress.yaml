{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.host -}}{{- fail "ingress.host is required when ingress.enabled" -}}{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bymorning.fullname" . }}
  labels: {{- include "bymorning.labels" . | nindent 4 }}
  {{- $annotations := .Values.ingress.annotations }}
  {{- if .Values.tls.enabled }}{{- $annotations = merge (dict "nginx.ingress.kubernetes.io/backend-protocol" "HTTPS") $annotations }}{{- end }}
  {{- with $annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bymorning.fullname" . }}
                port:
                  name: http
{{- end }}
