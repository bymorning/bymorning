services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bymorning
      POSTGRES_PASSWORD: bymorning
      POSTGRES_USER: bymorning
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bymorning -d bymorning"]
      interval: 2s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
