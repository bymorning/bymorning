apiVersion: v1
kind: ServiceAccount
metadata:
  name: bymorning-gateway
  annotations:
    # Terraform output gateway_client_id / tenant_id.
    azure.workload.identity/client-id: 00000000-0000-0000-0000-000000000000
    azure.workload.identity/tenant-id: 00000000-0000-0000-0000-000000000000
# No Kubernetes API access by default; the code-interpreter-kubernetes component turns this on.
automountServiceAccountToken: false
