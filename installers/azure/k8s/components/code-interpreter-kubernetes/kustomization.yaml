apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Kubernetes Code Interpreter (plugins/code-interpreter-kubernetes, bundled in the Gateway image).
#
# This component does the Gateway side only:
#   1. replaces the installation config with one that selects the "kubernetes"
#      implementation (config/bymorning.jsonc; set `image` (digest-pinned; the host
#      refuses startup with a tag or placeholder), runtimeClassName, and
#      the sandbox node selector/tolerations to match your cluster), and
#   2. mounts the Gateway service-account token so the plugin can reach the
#      Kubernetes API (the base leaves it unmounted).
#
# The sandbox namespace, Role/RoleBinding for the Gateway ServiceAccount
# (pods create/get/list/delete, pods/exec get/create), sandbox ServiceAccount,
# ResourceQuota, and the deny-all NetworkPolicy come from the plugin's own
# manifests (plugins/code-interpreter-kubernetes/deploy in the source tree,
# sandbox/ in the customer package). Kustomize cannot reference files outside
# this directory tree, so apply them separately:
#
#   kubectl apply -k sandbox
#
# The RoleBinding subject there must be ServiceAccount bymorning-gateway in
# namespace bymorning (this kit's defaults). The plugin requires a
# NetworkPolicy-enforcing CNI (this kit's Terraform enables Cilium) and refuses to
# execute when the sandbox namespace has no deny-all policy.

configMapGenerator:
  - name: bymorning-config
    behavior: replace
    files:
      - bymorning.jsonc=config/bymorning.jsonc

patches:
  - target:
      kind: ServiceAccount
      name: bymorning-gateway
    patch: |-
      - op: replace
        path: /automountServiceAccountToken
        value: true
  - target:
      kind: Deployment
      name: bymorning
    patch: |-
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: true
