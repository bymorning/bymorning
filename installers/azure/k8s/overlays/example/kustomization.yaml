apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Example overlay. Real deployments generate one from Terraform outputs:
#   installers/azure/scripts/overlay.sh <outputs.json> deploy --host ... --image ...
resources:
  - ../../base

components:
  # - ../../components/bedrock-web-identity   # or bedrock-api-key
  # - ../../components/code-interpreter-kubernetes

configMapGenerator:
  - name: bymorning-env
    behavior: merge
    literals:
      - APP_ORIGIN=https://bymorning.contoso.us
      - AZURE_CLOUD=AzureUSGovernment
      - STORAGE_ACCOUNT_URL=https://stbymorning1a2b3.blob.core.usgovcloudapi.net
      - STORAGE_CONTAINER=bymorning
      - KEY_VAULT_KEY=https://kv-bymorning-1a2b3.vault.usgovcloudapi.net/keys/bymorning-cipher

images:
  - name: bymorning
    newName: acrbymorning1a2b3.azurecr.us/bymorning
    newTag: azure

patches:
  - target:
      kind: ServiceAccount
      name: bymorning-gateway
    patch: |-
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1client-id
        value: 11111111-1111-1111-1111-111111111111
      - op: replace
        path: /metadata/annotations/azure.workload.identity~1tenant-id
        value: 22222222-2222-2222-2222-222222222222
  - target:
      kind: Ingress
      name: bymorning
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: bymorning.contoso.us
      - op: replace
        path: /spec/tls/0/hosts/0
        value: bymorning.contoso.us
