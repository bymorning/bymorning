<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="ByMorning workspace administration" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <title>ByMorning</title>
    <script src="/bymorning-theme-preload.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: var(--color-bg-deep, Canvas);
      }
      :root[data-color-scheme="light"] {
        color-scheme: light;
      }
      :root[data-color-scheme="dark"] {
        color-scheme: dark;
      }
      #boot-status {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        width: 100%;
        height: 100dvh;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        margin: 0;
        background: var(--color-bg-deep, Canvas);
      }
      #boot-status > [data-slot="shell-body"] {
        display: flex;
        min-height: 0;
        flex: 1;
        gap: 6px;
      }
      #boot-status [data-slot="project-sidebar"][data-open] {
        width: var(--project-sidebar-width, 256px);
      }
      #boot-status [data-slot="shell-content"] {
        min-width: 0;
        min-height: 0;
        flex: 1;
        border-radius: var(--radius-2xl, 16px);
        background: var(--color-bg-surface, Canvas);
        box-shadow: var(--shadow-raised);
      }
    </style>
  </head>
  <body>
    <noscript>
      <style>
        #boot-status {
          display: none;
        }
      </style>
      JavaScript is required to use ByMorning.
    </noscript>
    <div id="root"></div>
    <div id="boot-status" data-component="shell" data-layout="contained" aria-busy="true">
      <div data-slot="shell-body">
        <aside data-slot="project-sidebar" data-open="" style="--project-sidebar-width: 256px"></aside>
        <main data-slot="shell-content"></main>
      </div>
    </div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
