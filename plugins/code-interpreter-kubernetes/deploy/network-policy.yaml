# Deny all ingress and egress for every pod in the sandbox namespace (empty podSelector). This is what replaces
# Docker's `--network none`: the pod still gets a network interface, and the policy blocks DNS, the pod network,
# the cloud metadata endpoints (169.254.169.254, 168.63.129.16) and the API server. The plugin cannot enforce
# this. It requires a CNI that enforces NetworkPolicy (AKS: Azure Network Policy Manager, Calico or Cilium,
# chosen when the cluster is created) and the plugin only checks that this object exists.
# Do not add allow policies to this namespace: policies are additive, and the plugin refuses to run when a policy
# selecting sandbox pods allows any traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-deny-all
  namespace: bymorning-sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
